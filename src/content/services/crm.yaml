forWhom:
  ru: Бизнесу, где заявки приходят из нескольких мест, а клиентская база живёт в телефоне администратора.
  kk: Өтінімдер бірнеше жерден келетін, ал клиенттер базасы әкімшінің телефонында тұратын бизнеске.
  en: Businesses where requests come from several places and the customer base lives in the administrator's phone.
