description:
  ru: Все клиенты и заявки в одном месте вместо тетрадки и переписок. Видно, кто написал, кто записался, кто пропал — и кому пора напомнить о себе.
  kk: Дәптер мен хат алмасудың орнына барлық клиенттер мен өтінімдер бір жерде. Кім жазды, кім жазылды, кім жоғалды — және кімге еске салу керек екені көрінеді.
  en: All customers and requests in one place instead of a notebook and chats. You see who wrote, who booked, who went quiet — and who needs a reminder.
