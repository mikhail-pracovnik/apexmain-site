title:
  ru: Разработка баз данных
  kk: Деректер базасын әзірлеу
  en: Database development
description:
  ru: Собираем разрозненные таблицы, выгрузки и записи в одну аккуратную базу. Данные не теряются, не дублируются и доступны тем, кому они нужны.
  kk: Шашыраңқы кестелерді, жүктемелерді және жазбаларды бір ұқыпты базаға жинаймыз. Деректер жоғалмайды, қайталанбайды және оларға мұқтаж адамдарға қолжетімді.
  en: We bring scattered spreadsheets, exports and records into one tidy database. Data does not get lost or duplicated and is available to the people who need it.
tags:
  ru: [Структура данных, Импорт, Отчёты, Резервные копии]
  kk: [Деректер құрылымы, Импорт, Есептер, Резервтік көшірмелер]
  en: [Data structure, Import, Reports, Backups]
forWhom:
  ru: Тем, у кого учёт клиентов, товаров или записей разбросан по таблицам и уже мешает работать.
  kk: Клиенттер, тауарлар немесе жазылулар есебі кестелерге шашырап, жұмысқа кедергі келтіре бастағандарға.
  en: Those whose records of customers, products or bookings are scattered across spreadsheets and get in the way.
includes:
  ru:
    - Разбор того, какие данные у вас есть и как вы ими пользуетесь
    - Проектирование структуры базы
    - Перенос данных из таблиц и выгрузок
    - Доступы по ролям для сотрудников
    - Отчёты и выгрузки по запросу
    - Резервное копирование
  kk:
    - Қандай деректеріңіз бар және оларды қалай пайдаланатыныңызды талдау
    - База құрылымын жобалау
    - Кестелер мен жүктемелерден деректерді көшіру
    - Қызметкерлерге рөлдер бойынша қолжетімділік
    - Сұраныс бойынша есептер мен жүктемелер
    - Резервтік көшіру
  en:
    - Review of what data you have and how you use it
    - Database structure design
    - Moving data from spreadsheets and exports
    - Role-based access for staff
    - Reports and exports on request
    - Backups
