title:
  ru: Бренд в digital
  kk: Digital-тағы бренд
  en: Brand in digital
short:
  ru: Убедительный образ бренда в соцсетях и системная работа с аудиторией.
  kk: Әлеуметтік желілердегі сенімді бренд бейнесі және аудиториямен жүйелі жұмыс.
  en: A convincing brand image on social media and consistent work with your audience.
description:
  ru: Помогаем бренду выглядеть убедительно в digital и выстраивать системную коммуникацию с аудиторией — от позиционирования до контента и продвижения.
  kk: Брендке digital-та сенімді көрінуге және аудиториямен жүйелі коммуникация құруға көмектесеміз — позиционированиеден контент пен жылжытуға дейін.
  en: We help your brand look convincing in digital and build consistent communication with your audience — from positioning to content and promotion.
audience:
  ru: Бизнесу, который хочет усилить присутствие в социальных сетях и превратить внимание аудитории в реальные обращения.
  kk: Әлеуметтік желілердегі қатысуын күшейтіп, аудитория назарын нақты өтінімдерге айналдырғысы келетін бизнеске.
  en: Businesses that want a stronger presence on social media and to turn the audience's attention into real requests.
includes:
  ru:
    - Анализ бренда и текущего присутствия
    - Позиционирование и контент-стратегия
    - Визуальная концепция
    - Контент и регулярные публикации
    - Продвижение и аналитика
  kk:
    - Бренд пен қазіргі қатысуды талдау
    - Позиционирование және контент-стратегия
    - Визуалды тұжырымдама
    - Контент және тұрақты жарияланымдар
    - Жылжыту және аналитика
  en:
    - Brand and current presence analysis
    - Positioning and content strategy
    - Visual concept
    - Content and regular posting
    - Promotion and analytics
