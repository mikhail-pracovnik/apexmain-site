description:
  ru: Оформляем профиль так, чтобы с первого взгляда было понятно, что вы продаёте и как записаться. Контент-план, Reels и сторис, которые приводят клиентов, а не только лайки.
  kk: Профильді бір қарағанда не сататыныңыз және қалай жазылуға болатыны түсінікті болатындай етіп рәсімдейміз. Тек лайк емес, клиент әкелетін контент-жоспар, Reels және сторис.
  en: We set up your profile so it is instantly clear what you sell and how to book. A content plan, Reels and stories that bring customers, not just likes.
