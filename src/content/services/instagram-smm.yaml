forWhom:
  ru: Тем, у кого Instagram есть и подписчики есть, а записей из него мало.
  kk: Instagram-ы да, жазылушылары да бар, бірақ одан жазылулар аз келетіндерге.
  en: Those who have Instagram and followers, but few bookings from it.
