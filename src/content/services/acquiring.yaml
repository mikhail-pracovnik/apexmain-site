    - Связка оплат с CRM и учётом
    - Проверка платежей и чеков перед запуском
  kk:
    - Айналымыңызға сай банктердің шарттарын салыстыру
    - Сайтқа онлайн төлемді қосу
    - QR және терминал арқылы төлем
    - Төлемдерді CRM мен есеппен байланыстыру
    - Іске қосар алдында төлемдер мен чектерді тексеру
  en:
    - Comparing bank terms for your turnover
    - Connecting online payment to the website
