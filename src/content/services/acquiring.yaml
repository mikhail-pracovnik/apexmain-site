# videoMini нет: на карточке главной нейтральная заглушка
title:
  ru: Подключение эквайринга (онлайн продажи)
  kk: Эквайрингті қосу (онлайн сатылым)
  en: Payment acquiring (online sales)
short:
  ru: Приём оплаты картой и по QR на сайте и в точке продаж.
  kk: Сайтта және сауда нүктесінде карта мен QR арқылы төлем қабылдау.
  en: Card and QR payments on your website and at the point of sale.
description:
  ru: Настраиваем приём оплаты картой и QR на сайте и в точке продаж. Помогаем выбрать банк, подключаем оплату к сайту, CRM и учёту и проверяем корректность платежей и чеков перед запуском.
  kk: Сайтта және сауда нүктесінде карта мен QR арқылы төлем қабылдауды баптаймыз. Банк таңдауға көмектесеміз, төлемді сайтқа, CRM мен есепке қосамыз және іске қосар алдында төлемдер мен чектердің дұрыстығын тексереміз.
  en: We set up card and QR payments on your website and at the point of sale. We help you choose a bank, connect payments to the website, CRM and accounting, and check that payments and receipts work correctly before launch.
audience:
  ru: Тем, кто хочет принимать предоплату на сайте или навести порядок в оплатах в точке продаж.
  kk: Сайтта алдын ала төлем қабылдағысы немесе сауда нүктесіндегі төлемдерді ретке келтіргісі келетіндерге.
  en: Those who want to take prepayments on the website or put payments at the point of sale in order.
includes:
  ru:
    - Сравнение условий банков под ваш оборот
    - Подключение онлайн-оплаты к сайту
    - Оплата по QR и через терминал
    - Связка оплат с CRM и учётом
    - Проверка платежей и чеков перед запуском
  kk:
    - Айналымыңызға сай банктердің шарттарын салыстыру
    - Сайтқа онлайн төлемді қосу
    - QR және терминал арқылы төлем
    - Төлемдерді CRM мен есеппен байланыстыру
    - Іске қосар алдында төлемдер мен чектерді тексеру
  en:
    - Comparing bank terms for your turnover
    - Connecting online payment to the website
    - QR and terminal payments
    - Linking payments with CRM and accounting
    - Testing payments and receipts before launch
