title:
  ru: Подключение эквайринга
  kk: Эквайрингті қосу
  en: Payment acquiring setup
description:
  ru: Принимаем оплату картой и QR на сайте и в точке продаж. Помогаем выбрать банк, подключаем оплату к сайту, CRM и учёту, проверяем, что деньги и чеки доходят.
  kk: Сайтта және сауда нүктесінде карта мен QR арқылы төлем қабылдаймыз. Банк таңдауға көмектесеміз, төлемді сайтқа, CRM мен есепке қосамыз, ақша мен чектің жеткенін тексереміз.
  en: Card and QR payments on your website and at the point of sale. We help you choose a bank, connect payments to the website, CRM and accounting, and check that money and receipts arrive.
tags:
  ru: [Онлайн-оплата, QR, Терминал, Чеки]
  kk: [Онлайн төлем, QR, Терминал, Чектер]
  en: [Online payment, QR, Terminal, Receipts]
forWhom:
  ru: Тем, кто хочет принимать предоплату на сайте или навести порядок в оплатах в точке продаж.
  kk: Сайтта алдын ала төлем қабылдағысы немесе сауда нүктесіндегі төлемдерді ретке келтіргісі келетіндерге.
  en: Those who want to take prepayments on the website or put payments at the point of sale in order.
