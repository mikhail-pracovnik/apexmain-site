title:
  ru: Таргетинг и SEO
  kk: Таргетинг және SEO
  en: Targeting and SEO
short:
  ru: Устойчивый поток клиентов из поиска, карт и социальных сетей.
  kk: Іздеуден, карталардан және әлеуметтік желілерден тұрақты клиент ағыны.
  en: A steady flow of customers from search, maps and social media.
description:
  ru: Выстраиваем устойчивый поток целевой аудитории из поиска, карт и социальных сетей. Соединяем рекламу, SEO и аналитику в единую систему привлечения.
  kk: Іздеуден, карталардан және әлеуметтік желілерден мақсатты аудиторияның тұрақты ағынын құрамыз. Жарнаманы, SEO мен аналитиканы клиент тартудың біртұтас жүйесіне біріктіреміз.
  en: We build a steady flow of your target audience from search, maps and social media. We combine ads, SEO and analytics into a single acquisition system.
audience:
  ru: Бизнесу, который хочет получать клиентов из digital системно — и постепенно снижать зависимость от постоянного увеличения рекламного бюджета.
  kk: Digital-тан клиенттерді жүйелі түрде алғысы келетін және жарнама бюджетін үнемі көбейтуге тәуелділікті біртіндеп азайтқысы келетін бизнеске.
  en: Businesses that want to get customers from digital consistently — and gradually rely less on an ever-growing ad budget.
includes:
  ru:
    - Анализ рынка, аудитории и спроса
    - Стратегия таргетированной рекламы
    - SEO-стратегия и продвижение сайта
    - Подгонка сайта и посадочных страниц
    - Настройка аналитики и отслеживания обращений
    - Регулярная оптимизация и развитие каналов
  kk:
    - Нарықты, аудиторияны және сұранысты талдау
    - Таргеттелген жарнама стратегиясы
    - SEO-стратегия және сайтты жылжыту
    - Сайт пен қону беттерін бейімдеу
    - Аналитика мен өтінімдерді бақылауды баптау
    - Арналарды тұрақты оңтайландыру және дамыту
  en:
    - Market, audience and demand analysis
    - Targeted advertising strategy
    - SEO strategy and website promotion
    - Fine-tuning the website and landing pages
    - Analytics and request tracking setup
    - Regular optimisation and channel growth
