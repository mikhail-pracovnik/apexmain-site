description:
  ru: Реклама в Instagram и в поиске, карточки в 2ГИС и на картах. Считаем, сколько стоит одна заявка, и отключаем то, что не окупается.
  kk: Instagram мен іздеудегі жарнама, 2ГИС пен карталардағы карточкалар. Бір өтінімнің қанша тұратынын есептеп, өзін ақтамайтынын өшіреміз.
  en: Ads on Instagram and in search, listings on 2GIS and maps. We count what one request costs and switch off what does not pay off.
