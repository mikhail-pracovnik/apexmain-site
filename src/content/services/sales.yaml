description:
  ru: Наводим порядок в том, как вы отвечаете клиентам. Быстрые ответы, скрипты для администратора и напоминания, чтобы клиенты записывались и возвращались.
  kk: Клиенттерге қалай жауап беретініңізді ретке келтіреміз. Клиенттер жазылып, қайта оралуы үшін жылдам жауаптар, әкімшіге арналған скрипттер және еске салғыштар.
  en: We put order into how you answer customers. Quick replies, scripts for your administrator and reminders, so customers book and come back.
