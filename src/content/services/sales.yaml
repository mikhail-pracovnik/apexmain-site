title:
  ru: Продажи и CRM
  kk: Сатылым және CRM
  en: Sales and CRM
short:
  ru: Система продаж, в которой заявки не теряются, а клиенты возвращаются.
  kk: Өтінімдер жоғалмайтын, ал клиенттер қайта оралатын сату жүйесі.
  en: A sales system where requests don't get lost and customers come back.
description:
  ru: Выстраиваем систему работы с клиентами — от первого обращения до повторной покупки. Объединяем CRM, коммуникации и автоматизацию, чтобы продажи не зависели от памяти отдельных сотрудников.
  kk: Клиенттермен жұмыс жүйесін құрамыз — алғашқы өтінімнен қайталама сатып алуға дейін. Сатылым жекелеген қызметкерлердің есіне тәуелді болмауы үшін CRM-ді, коммуникацияны және автоматтандыруды біріктіреміз.
  en: We build a system for working with customers — from the first request to the repeat purchase. We bring together CRM, communication and automation so sales don't depend on the memory of individual employees.
audience:
  ru: Бизнесу, где заявки приходят из разных каналов, часть клиентов теряется в переписках, а повторные обращения зависят от памяти администратора или менеджера.
  kk: Өтінімдер әртүрлі арналардан келетін, клиенттердің бір бөлігі хат алмасуда жоғалатын, ал қайта жүгінулер әкімшінің не менеджердің есіне байланысты бизнеске.
  en: Businesses where requests come from different channels, some customers get lost in chats, and repeat visits depend on the memory of an administrator or manager.
includes:
  ru:
    - Анализ текущего процесса продаж и коммуникации с клиентами
    - Подбор и настройка CRM под задачи бизнеса
    - Воронка от первого обращения до оплаты
    - Подключение сайта, WhatsApp, Instagram и телефонии
    - Скрипты и шаблоны ответов для сотрудников
    - Автоматические напоминания о записи и повторном обращении
    - Перенос существующей клиентской базы
    - Обучение сотрудников работе с системой
  kk:
    - Қазіргі сату процесін және клиенттермен коммуникацияны талдау
    - Бизнес міндеттеріне сай CRM таңдау және баптау
    - Алғашқы өтінімнен төлемге дейінгі воронка
    - Сайтты, WhatsApp, Instagram және телефонияны қосу
    - Қызметкерлерге арналған скрипттер мен жауап үлгілері
    - Жазылу және қайта жүгіну туралы автоматты еске салғыштар
    - Бар клиенттер базасын көшіру
    - Қызметкерлерді жүйемен жұмыс істеуге үйрету
  en:
    - Analysis of your current sales process and customer communication
    - Choosing and setting up a CRM for your business
    - A pipeline from the first request to payment
    - Connecting the website, WhatsApp, Instagram and telephony
    - Scripts and reply templates for staff
    - Automatic booking and follow-up reminders
    - Moving your existing customer base
    - Training staff to use the system
