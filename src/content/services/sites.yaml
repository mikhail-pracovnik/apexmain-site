forWhom:
  ru: Бизнесу, у которого клиенты пишут в мессенджеры и теряются, а в 2ГИС и Instagram нет понятной ссылки «куда записаться».
  kk: Клиенттері мессенджерге жазып, жоғалып кететін, ал 2ГИС пен Instagram-да «қайда жазылу керек» деген түсінікті сілтемесі жоқ бизнеске.
  en: Businesses whose customers write in messengers and get lost, with no clear "where to book" link on 2GIS or Instagram.
