title:
  ru: Сайты
  kk: Сайттар
  en: Websites
short:
  ru: Сайт, который понятно объясняет ваше предложение и доводит клиента до заявки.
  kk: Ұсынысыңызды түсінікті түсіндіріп, клиентті өтінімге дейін жеткізетін сайт.
  en: A website that clearly explains your offer and leads the customer to a request.
description:
  ru: Создаём сайты, которые понятно представляют ваш бизнес, помогают клиенту разобраться в предложении и приводят его к обращению. Продумываем структуру, дизайн, контент и путь клиента от первого просмотра до заявки.
  kk: Бизнесіңізді түсінікті көрсететін, клиентке ұсынысты түсінуге көмектесетін және оны өтінімге жеткізетін сайттар жасаймыз. Құрылымды, дизайнды, контентті және клиенттің алғашқы көруден өтінімге дейінгі жолын ойластырамыз.
  en: We build websites that present your business clearly, help customers understand your offer and lead them to get in touch. We think through the structure, design, content and the customer's path from the first visit to the request.
audience:
  ru: Бизнесу, которому нужен современный сайт как полноценная точка контакта с клиентом — вместо разрозненной информации в Instagram, 2ГИС и мессенджерах.
  kk: Instagram, 2ГИС және мессенджерлердегі шашыраңқы ақпараттың орнына клиентпен толыққанды байланыс нүктесі ретінде заманауи сайт қажет бизнеске.
  en: Businesses that need a modern website as a full point of contact with customers — instead of scattered information on Instagram, 2GIS and messengers.
includes:
  ru:
    - Структура и тексты, понятные клиенту
    - Дизайн под ваш бренд с приоритетом мобильной версии
    - Услуги, цены, кейсы, отзывы и контакты
    - Заявки и быстрый переход в WhatsApp и Telegram
    - Русская, казахская и английская версии
    - Техническая настройка, подключение сервисов и запуск — на нас
  kk:
    - Клиентке түсінікті құрылым мен мәтіндер
    - Мобильді нұсқаға басымдық берілген, брендіңізге сай дизайн
    - Қызметтер, бағалар, кейстер, пікірлер және байланыстар
    - Өтінімдер және WhatsApp пен Telegram-ға жылдам өту
    - Орыс, қазақ және ағылшын нұсқалары
    - Техникалық баптау, сервистерді қосу және іске қосу — біздің мойнымызда
  en:
    - Structure and copy your customers understand
    - Design in your brand, mobile first
    - Services, prices, case studies, reviews and contacts
    - Requests and a quick jump to WhatsApp and Telegram
    - Russian, Kazakh and English versions
    - Technical setup, connecting services and launch — on us
